defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
  job:
    chdir: false
_target_: agent.finetune.train_distill_residual_flow_agent.TrainDistillResidualFlowAgent

# DICE-RL residual finetune on DexJoCo pick_bucket (50-demo state-based study).
# Mirrors cfg/robomimic/finetune/pinch_tongs/ft_distill_residual_flow_mlp.yaml with the
# runtime values used for the pinch_tongs / pick_bucket runs (n_envs 8, gradient_steps 20,
# eval 5 rounds x 8 envs = 40 fixed-seed episodes).
name: ${env_name}_n50_ft_distill_residual_flow_mlp_ta${horizon_steps}_fl${flow_steps}
logdir: log_dir/dexjoco-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
# BC base = best 50-episode fixed-seed eval among the n50 pretrain checkpoints (state_4000 = 48%).
base_policy_path: log_dir/dexjoco-pretrain/pick_bucket_n50_pre_flow_matching_mlp_ta4_td10/2026-08-30_15-58-23_42/checkpoint/state_4000.pt
normalization_path: data_dir/dexjoco/pick_bucket_n50/ph_finetune/normalization.npz

seed: 42
device: cuda:0
env_name: pick_bucket
run_eval: true  # Enable evaluation environments and periodic evaluation during training
obs_dim: 38
action_dim: 22
flow_steps: 10
cond_steps: 1
horizon_steps: 4
act_steps: 4
noise_dim: 88  # action_dim * horizon_steps = 22 * 4 = 88 for chunked actions

env:
  n_envs: 8  # CPU-bound (8 cores, MuJoCo physics); one finetune at a time
  name: ${env_name}
  env_type: dexjoco
  best_reward_threshold_for_success: 1
  max_episode_steps: 1000
  save_video: False
  wrappers:
    dexjoco_lowdim:
      normalization_path: ${normalization_path}
      task_name: ${env_name}
      success_steps_before_termination: 1  # Terminate 1 step after success (reward>=1)
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True
      gamma: ${train.gamma}

wandb:
  entity: gist_ailab  # informational; TrainAgent uses the wandb default entity
  project: dexjoco-${env_name}-finetune
  run: ${now:%Y-%m-%d_%H-%M-%S_%f}_${name}

train:
  num_train_steps: 30000  # training iterations (chunk steps); env steps = x horizon_steps x n_envs = 960k
  val_freq: 10
  n_steps: 200
  n_train_itr: 1000
  batch_size: 256
  eval_freq: 1000 # Evaluate every N steps
  gamma: 0.99
  tau: 0.01
  update_freq: 1
  gradient_steps: 20  # UTD = gradient_steps / n_envs = 2.5 (same as n_envs 4 / gs 10)

  # Learning rates - smaller for finetuning
  actor_lr: 1e-4
  critic_lr: 1e-4  # Much smaller to prevent Q-value explosion

  # Weight decay
  actor_weight_decay: 1e-5
  critic_weight_decay: 1e-5

  # Learning rate scheduler
  use_lr_scheduler: True
  lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-6

  # Target networks
  actor_update_freq: 2
  critic_target_update_freq: 2

  save_freq: 1000  # the agent reads train.save_freq (default 1000); save_model_freq is unused
  save_model_freq: 100
  render:
    freq: 1
    num: 0

  # Logging
  log_freq: 1
  max_grad_norm: 1.0

# Replay buffer settings
replay_buffer:
  max_size: 5000000
  # N-step returns
  use_n_step: true  # Whether to use n-step returns
  n_step: 3  # Number of steps for n-step returns
  # Expert dataset n-step settings (can differ from online data)
  expert_use_n_step: ${expert_dataset.use_n_step}
  expert_n_step: ${expert_dataset.n_step}

# RLPD (Reinforcement Learning with Prior Data) settings
use_rlpd: true  # Enable RLPD symmetric sampling (set to false for regular replay buffer)
expert_ratio: 0.3  # Initial/fixed expert ratio (ignored if use_adaptive_expert_ratio=true)

# Adaptive expert ratio settings
use_adaptive_expert_ratio: true  # Enable adaptive expert ratio scheduling
adaptive_expert_ratio_start: 0.9  # Start expert-heavy after pretraining (long-horizon task)
adaptive_expert_ratio_end: 0.1    # Decay to 10% expert data
adaptive_expert_ratio_steps: 10000  # Number of env steps for linear decay (K)

model:
  _target_: model.rl.distill_residual_rl.DistillResidualRLModel
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  noise_dim: ${noise_dim}
  cond_steps: ${cond_steps}
  horizon_steps: ${horizon_steps}
  device: ${device}

  # Residual conditioning: condition residual on base action instead of noise
  condition_residual_on_base_action: false

  num_multi_z_for_actor_loss: 16  # Number of noise samples

  # N-step returns
  use_n_step: ${replay_buffer.use_n_step}
  n_step: ${replay_buffer.n_step}

  # Pretrained flow matching policy path (simplified loading)
  pretrained_flow_policy_path: ${base_policy_path}

  # Network configurations
  actor_hidden_dims: [1024, 1024, 1024]    # Residual actor: r_θ(s,z)
  critic_hidden_dims: [1024, 1024, 1024]   # Critic: Q(s,z,a) - input: s + z + a
  activation_type: "GELU"
  use_layernorm: true  # Layer normalization (RLPD paper recommendation)

  # Loss coefficients - strong residual regularization for the long-horizon task
  bc_loss_weight: 100.0  # ||r_θ(s,z)||² regularization in residual RL

  critic_weight: 1.0
  use_soft_q_filtering: false

  q_filtering_warmup_steps: 2000
  q_underestimation_threshold: -0.5
  replay_flow_warmup_steps: 4000

  # q normalization
  use_q_normalization: true  # this has to be true

  # Disable Q loss for expert data samples (ablation study)
  disable_q_loss_for_expert_data: true
  # Always retain BC loss for expert data
  always_retain_bc_loss_for_expert_data: false

  # Q-function noise dependency
  multi_sample_next_noise: true
  num_next_noise_samples: 4  # Number of samples for next noise (K in the paper)

  # Critic ensemble settings
  critic_ensemble_size: 10  # Number of critic networks for reduced overestimation bias

# Expert dataset for RLPD
expert_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceQLearningDataset
  dataset_path: data_dir/dexjoco/pick_bucket_n50/ph_finetune/train.npz
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  device: ${device}
  discount_factor: ${train.gamma}  # Use same gamma as training
  gamma: ${train.gamma}  # Discount for horizon aggregation
  max_n_episodes: 50
  use_img: false  # State-based for this config
  success_steps_for_termination: ${env.wrappers.dexjoco_lowdim.success_steps_before_termination}  # Match online env
  use_n_step: true
  n_step: 3

# Visualization settings
visualize_trajectories: false
visualization_freq: 200000000
num_eval_episodes: 5  # rounds; total eval episodes = 5 x eval_n_envs = 40 (seeds 10000..10039)
eval_n_envs: 8

# Q-value overestimation analysis
log_q_overestimation: true

# Exploration strategy settings
# Valid strategy names: ["standard", "max_q_min", "max_q_std", "max_q_std_filtered_by_min"]
online_explore_strategy: "max_q_min"  # Strategy for online data collection during training
evaluate_strategy: "max_q_min"  # Strategy for evaluation episodes
num_exploration_samples: 16  # Number of action samples for multi-sample strategies
